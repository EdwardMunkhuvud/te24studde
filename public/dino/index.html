<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Dino · Studde</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #202124; color: #bdc1c6; font: 13px Arial, sans-serif; transition: background-color 1s, color 1s; }
    #game { position: relative; width: 100%; max-width: 600px; height: 150px; margin: 30px auto 0; }
    .icon-offline, #offline-resources { display: none; }
    .runner-container { position: absolute; top: 0; height: 150px; overflow: hidden; width: 44px; }
    .runner-canvas { position: absolute; top: 0; height: 150px; image-rendering: pixelated; filter: invert(1); }
    html.inverted body { background: #f7f7f7; color: #535353; }
    html.inverted .runner-canvas { filter: none; }
    .controller { display: none; }
    .hidden { display: none !important; }
    #hint { position: relative; text-align: center; margin: 20px 12px 0; line-height: 1.6; min-height: 42px; }
    #controls { display: flex; justify-content: center; gap: 12px; margin: 12px; }
    button { min-width: 100px; padding: 10px 18px; border-radius: 6px; border: 1px solid #5f6368; color: inherit; background: transparent; font: inherit; touch-action: none; cursor: pointer; }
    button:focus-visible { outline: 2px solid #8ab4f8; outline-offset: 3px; }
    @media (pointer: fine) { #controls { display: none; } }
  </style>
</head>
<body>
  <div id="game" aria-label="Dinosauriespelet"><span class="icon-offline"></span></div>
  <p id="hint" role="status">Tryck på dinosaurien eller mellanslag för att spela</p>
  <div id="controls"><button id="duck" type="button">↓ Ducka</button><button id="jump" type="button">↑ Hoppa</button></div>
  <div id="offline-resources">
    <img id="offline-resources-1x" src="sprite-1x.png" alt="">
    <img id="offline-resources-2x" src="sprite-2x.png" alt="">
  </div>
  <script>window.loadTimeData = { valueExists: function () { return false; } };</script>
  <script src="runner.js"></script>
  <script src="bridge.js"></script>
</body>
</html>
